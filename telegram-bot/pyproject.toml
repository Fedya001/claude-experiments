[project]
name = "telegram-bot"
version = "0.1.0"
description = "Personal Telegram bot hosting pluggable apps (commands)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
garmin_to_strava = ["garminconnect>=0.2.30", "gpxpy>=1.6", "playwright>=1.45"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
