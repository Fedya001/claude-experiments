[project]
name = "flipper-apps"
version = "0.1.0"
description = "User-defined apps reachable through a Telegram bot gateway"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
garmin_to_strava = ["garminconnect>=0.2.30", "gpxpy>=1.6", "playwright==1.64.1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
