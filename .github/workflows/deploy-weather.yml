name: Deploy Fair Weather to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["weather/**", ".github/workflows/deploy-weather.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: weather
      - id: deployment
        uses: actions/deploy-pages@v4
